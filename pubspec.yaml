name: sosigi
description: Premium personalized news app
publish_to: 'none'

version: 1.0.1+10

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.1.5
  http: ^1.2.2
  webfeed_revised: ^0.8.0
  google_mobile_ads: ^5.1.0
  flutter_local_notifications: ^17.2.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
